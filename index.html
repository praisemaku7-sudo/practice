<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1311" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ledger">
  <meta name="robots" content="noindex">
  <meta name="description" content="Import your bank statements, see where your money goes, and ask: can I afford this?">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <title>Pocket Ledger</title>
</head>
<body>
  <header class="topbar">
    <a href="#/home" class="brand"><span class="logo">£</span> Pocket Ledger</a>
    <div class="top-actions">
      <button class="scope-btn" id="scope-btn" data-action="scope-pick" aria-label="Whose money to show">🏠 Household</button>
      <button class="icon-btn" data-action="import" aria-label="Import statement">＋</button>
      <a class="icon-btn" href="#/settings" aria-label="Settings">⚙︎</a>
    </div>
  </header>
  <main id="main" class="main"><div class="skeleton" aria-label="Loading"><div style="height:56px;width:60%;margin:8px auto"></div><div style="height:190px"></div><div style="height:120px"></div><div style="height:260px"></div></div></main>
  <nav class="tabbar" aria-label="Sections">
    <a href="#/home" data-view="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.4 6.4"/></svg>Overview</a>
    <a href="#/budget" data-view="budget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9h10M7 13h6M7 17h8"/></svg>Budget</a>
    <a href="#/afford" data-view="afford" class="afford-tab"><span>?</span>Afford</a>
    <a href="#/insights" data-view="insights"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>Insights</a>
    <a href="#/accounts" data-view="accounts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/></svg>Accounts</a>
  </nav>
  <div id="sheet" class="sheet"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
