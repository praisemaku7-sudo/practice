<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1311" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ledger">
  <meta name="robots" content="noindex">
  <meta name="description" content="Import your bank statements, see where your money goes, and ask: can I afford this?">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg?v=4" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png?v=4">
  <title>Pocket Ledger</title>
  <script>try{var t=localStorage.getItem('pl-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
  <header class="topbar">
    <button class="back-btn" id="back-btn" data-action="nav-back" aria-label="Back" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Back</span></button>
    <a href="#/dash" class="brand" aria-label="Pocket Ledger home"><svg class="logo" viewBox="0 0 1024 1024" aria-hidden="true"><defs><linearGradient id="lgBg" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#f7fffb"/><stop offset="1" stop-color="#cff4e3"/></linearGradient><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bbf7d0"/><stop offset="1" stop-color="#86efac"/></linearGradient><linearGradient id="lg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#2dd4a4"/></linearGradient><linearGradient id="lg3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#059669"/></linearGradient></defs><rect width="1024" height="1024" rx="230" fill="url(#lgBg)"/><rect x="242" y="560" width="148" height="224" rx="74" fill="url(#lg1)"/><rect x="438" y="420" width="148" height="364" rx="74" fill="url(#lg2)"/><rect x="634" y="240" width="148" height="544" rx="74" fill="url(#lg3)"/></svg><span class="brand-name">Pocket Ledger</span></a>
    <div class="top-actions">
      <button class="scope-btn" id="scope-btn" data-action="scope-pick" aria-label="Whose money to show">🏠 Household</button>
      <button class="icon-btn bell-btn" id="bell-btn" data-action="bell-open" aria-label="Notifications"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6.5 2 6.5H4S6 14 6 9M10 19a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><b id="bell-count" class="bell-count" hidden>0</b></button>
      <button class="icon-btn" data-action="import" aria-label="Import statement">＋</button>
      <button class="icon-btn menu-btn" id="menu-btn" data-action="menu-toggle" aria-label="All pages and options" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    </div>
  </header>
  <main id="main" class="main"><div class="skeleton" aria-label="Loading"><div style="height:56px;width:60%;margin:8px auto"></div><div style="height:190px"></div><div style="height:120px"></div><div style="height:260px"></div></div></main>
  <nav class="tabbar" aria-label="Sections">
    <a href="#/dash" data-view="dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"/><path d="M5.5 9.5V20h13V9.5"/></svg>Home</a>
    <a href="#/home" data-view="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.4 6.4"/></svg>Month</a>
    <a href="#/afford" data-view="afford" class="afford-tab"><span>?</span>Afford</a>
    <a href="#/track" data-view="track"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-5 4 4 8-8"/><path d="M15 8h5v5"/></svg>On track</a>
    <a href="#/accounts" data-view="accounts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/></svg>Accounts</a>
  </nav>
  <div id="menu" class="menu"></div>
  <div id="sheet" class="sheet"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
